<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SheeTY Abyss</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap');

  @keyframes fadeIn {
    0% { opacity: 0; }
    100% { opacity: 1; }
  }

  @keyframes glowEffect {
    0% {
      text-shadow: 0 0 5px #ff6f00, 0 0 10px #ff6f00, 0 0 20px #ff6f00;
    }
    100% {
      text-shadow: 0 0 10px #ffa500, 0 0 20px #ffa500, 0 0 30px #ffa500;
    }
  }

  html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: url('./levels/background.gif') no-repeat center center fixed;
  background-size: cover;
  font-family: 'Orbitron', sans-serif;
  color: #ff6f00;
}

  canvas {
    display: block;
  }

  #startScreen {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.9);
    color: #ff6f00;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 10;
    animation: fadeIn 2s ease-in-out;
    font-family: 'Orbitron', sans-serif;
    text-align: center;
  }

    h1, h2 {
      color: #ff9966;
      text-shadow: 0 0 10px #ff9966;
    }
    button {
      padding: 1em 2em;
      margin-top: 1em;
      font-size: 1.5em;
      font-family: 'Orbitron', sans-serif;
      background: linear-gradient(145deg, #ff9966, #cc5200);
      color: white;
      border: none;
      border-radius: 0.5em;
      cursor: pointer;
      box-shadow: 0 0 10px #ff9966;
      transition: transform 0.2s, background 0.3s;
    }
    button:hover {
      transform: scale(1.05);
      background: linear-gradient(145deg, #cc5200, #ff9966);
    }
    button:active {
      transform: scale(0.98);
    }

  #startScreen h1 {
    font-size: 3em;
    animation: glowEffect 5s infinite alternate;
  }

  #startButton {
  all: unset; /* Removes ALL browser default button styles */
  display: inline-block;
  padding: 1em 2em;
  font-size: 1.2em;
  margin-top: 1em;
  background-color: rgba(255, 111, 0, 0.2); /* Burnt orange transparent */
  color: #ff6f00;
  border: 2px solid #ff6f00;
  border-radius: 8px;
  cursor: pointer;
  text-align: center;
  transition: background-color 0.3s, color 0.3s, box-shadow 0.3s;
  font-family: 'Orbitron', sans-serif;
  }

  #startButton:hover {
    background-color: #ff6f00;
    color: black;
    box-shadow: 0 0 15px #ff6f00;
  }

  #startButton:active {
    transform: scale(0.98);
  }

 #scoreDisplay {
  position: absolute;
  top: 10px;
  left: 10px;
  font-family: 'Orbitron', sans-serif;
  font-size: 1.5rem;
  color: #fff !important;
  animation: glowEffect 5s linear infinite;
  text-shadow: 0 0 5px #ff6f00;
  z-index: 5;
}
</style>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap');

#Button {
  all: unset;
  display: inline-block;
  padding: 1em 2em;
  font-size: 1.2em;
  margin-top: 1em;
  background-color: rgba(255, 111, 0, 0.2);
  color: #ff6f00;
  border: 2px solid #ff6f00;
  border-radius: 8px;
  cursor: pointer;
  text-align: center;
  transition: background-color 0.3s, color 0.3s, box-shadow 0.3s;
  font-family: 'Orbitron', sans-serif;
}

#Button:hover {
  background-color: #ff6f00;
  color: black;
  box-shadow: 0 0 15px #ff6f00;
}

#Button:active {
  transform: scale(0.98);
}

#scoreDisplay {
  font-family: 'Orbitron';
  color: #ff6f00;
  font-size: 24px;
  text-shadow: 0 0 5px #ff6f00;
}
</style>
</head>
<body>
<div id="startScreen">
<h1>SheeTy Abyss</h1>
<button id="startButton">Start SheeT</button>
</div>
<div id="scoreDisplay">Score: 0 | High Score: 0 | Level: 0 
</div>
<div id="healthBarContainer">
  <div id="healthBar"></div>
</div>
<canvas id="gameCanvas"></canvas>
<style>
  body {
    margin: 0;
    overflow: hidden;
    background: url('./levels/background.jpg') no-repeat center center fixed;
    background-size: cover;
    font-family: Arial, sans-serif;
    color: white;
  }

  #startScreen {
    position: absolute;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.8);
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    z-index: 10;
  }

#healthBarContainer {
  position: absolute;
  top: 50px;
  left: 10px;
  width: 220px;
  height: 25px;
  border-radius: 8px;
  border: 2px solid #ff6f00;
  background: rgba(0, 0, 0, 0.4);
  box-shadow: 0 0 15px rgba(255, 140, 26, 0.5);
  overflow: hidden;
  z-index: 5;
}

#healthBar {
  height: 100%;
  width: 100%;
  background: linear-gradient(to right, #00ff00, #88ff00);
  box-shadow: inset 0 0 10px #ff6f00;
  transition: width 0.3s ease, background 0.3s ease;
}

@keyframes flashRed {
  0%, 100% { background-color: #ff6f00; }
  50% { background-color: red; }
}

.flash-hit {
  animation: flashRed 0.3s ease;
}

  #startButton,
#Button {
  all: unset;

button#restartButton,
#restartButton {

  display: inline-block;

  margin-top: 1em;
  background-color: rgba(255, 111, 0, 0.2); /* Burnt orange transparent */

  border: 2px solid #ff6f00;

}

button#restartButton:hover,
#restartButton:hover {
  background-color: #ff6f00;
  color: black;
  box-shadow: 0 0 15px #ff6f00;
}

button#restartButton:active,
#restartButton:active {
  transform: scale(0.98);
}
</style>
<script src="./game.js"></script>
</body>
</html>
